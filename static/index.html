<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>全球金融数据看板</title>
<link rel="icon" type="image/png" href="/logo.png" />
<script src="/vendor/echarts.min.js"></script>
<style>
:root{
  --bg:#eef1f6; --bg2:#ffffff; --panel:#ffffff; --panel2:#f7f9fc;
  --text:#1a2130; --text2:#4a5568; --muted:#8a94a6; --line:#e2e8f0; --line2:#eef2f7;
  --up:#d6353b; --down:#12a05c; --accent:#2f6fe4; --accent2:#eaf1ff;
  --shadow:0 1px 2px rgba(20,32,54,.05), 0 6px 18px -8px rgba(20,32,54,.12);
  --radius:12px; --head:#f2f5fa;
}
html[data-theme="dark"]{
  --bg:#0e131b; --bg2:#151b25; --panel:#171e29; --panel2:#1d2532;
  --text:#e8edf5; --text2:#a9b4c5; --muted:#6f7d92; --line:#26303f; --line2:#212a37;
  --up:#ff5c62; --down:#28cb7e; --accent:#5b93ff; --accent2:#1c2740;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px -10px rgba(0,0,0,.6);
  --head:#1b2330;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1560px;margin:0 auto;padding:0 18px 60px}

/* ---------------- 顶栏 ---------------- */
.topbar{position:sticky;top:0;z-index:60;background:var(--bg2);border-bottom:1px solid var(--line);
  box-shadow:0 1px 12px -6px rgba(20,32,54,.25)}
.topbar .inner{max-width:1560px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:700;letter-spacing:.2px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent2)}
.brand small{font-weight:500;color:var(--muted);font-size:11.5px;letter-spacing:0}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--text2);
  padding:5px 11px;border-radius:8px;font-size:12px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.status{font-size:11.5px;color:var(--muted);white-space:nowrap}

/* ---------------- 板块类型选择（导航）---------------- */
.secnav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 14px}
.secnav button{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 8px;border:1px solid var(--line);background:var(--panel);color:var(--text2);
  border-radius:10px;font-size:12.5px;cursor:pointer;transition:.15s;font-family:inherit;
}
.secnav button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent2)}
.secnav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.secnav button .n{font-size:10.5px;opacity:.75}

/* ---------------- 板块 ---------------- */
.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.sec.dragging{opacity:.45;border-style:dashed}
.sec.drop-target{outline:2px solid var(--accent);outline-offset:-2px}
.sec-head{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;
  background:var(--head);border-bottom:1px solid transparent;user-select:none}
.sec-head:hover{background:var(--panel2)}
.sec:not(.closed) .sec-head{border-bottom-color:var(--line)}
.sec-head .grip{cursor:grab;color:var(--muted);font-size:13px;letter-spacing:-1px;padding:0 2px}
.sec-head .grip:active{cursor:grabbing}
.sec-head h2{margin:0;font-size:14px;font-weight:650;letter-spacing:.2px;white-space:nowrap}
.sec-head .cidx{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;
  padding:0 5px;line-height:16px}
.sec-head .sum{margin-left:auto;display:flex;gap:12px;align-items:center;font-size:12px;
  color:var(--text2);overflow:hidden;white-space:nowrap;flex-wrap:nowrap}
.sec-head .sum b{font-weight:650;font-variant-numeric:tabular-nums}
.sec-head .src{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 数据源链接 */
.slink{color:var(--muted);border-bottom:1px dashed var(--line);text-decoration:none;cursor:pointer}
.slink:hover{color:var(--accent);border-bottom-color:var(--accent);text-decoration:none}
.sep{margin:0 4px;color:var(--line);font-size:10px}
.grp-title .gsrc{font-weight:400;font-size:11px;color:var(--muted);white-space:nowrap}
.grp-title .gsrc:last-child{margin-left:auto}
.cp-src{font-size:11px;color:var(--muted);white-space:nowrap}
/* 折叠箭头：圆形底衬 + 加粗箭头，明显可见 */
.sec-head .chev{position:relative;flex:0 0 22px;width:22px;height:22px;border-radius:50%;
  background:var(--line2);color:var(--text2);transition:background .18s,color .18s,transform .18s}
.sec-head .chev::before{content:"";position:absolute;left:6.5px;top:6px;width:8px;height:8px;
  border-right:2.6px solid currentColor;border-bottom:2.6px solid currentColor;
  transform:rotate(45deg);transition:transform .18s}
.sec-head:hover .chev{background:var(--accent);color:#fff;transform:scale(1.08)}
.sec.closed .sec-head .chev::before{transform:rotate(-45deg)}
.sec.closed .sec-body{display:none}
.sec-body{padding:13px 14px 15px}

/* ---------------- 通用 ---------------- */
.grp-title{display:flex;align-items:center;gap:8px;margin:10px 0 9px;font-size:12.5px;color:var(--text2);
  font-weight:600;cursor:pointer;user-select:none;padding:5px 9px;border-radius:8px;transition:background .15s}
.grp:first-child>.grp-title{margin-top:0}
.grp-title:hover{background:var(--panel2)}
.grp-title.plain{cursor:default}
.grp-title.plain:hover{background:transparent}
.grp-title .cnt{font-weight:400;color:var(--muted);font-size:11.5px}
.grp-title .sp{margin-left:auto}
/* 二级分类折叠箭头 */
.grp-title .gchev{position:relative;flex:0 0 17px;width:17px;height:17px;border-radius:50%;
  background:var(--line2);color:var(--text2);transition:background .18s,color .18s}
.grp-title .gchev::before{content:"";position:absolute;left:5px;top:4.5px;width:6px;height:6px;
  border-right:2.3px solid currentColor;border-bottom:2.3px solid currentColor;
  transform:rotate(45deg);transition:transform .18s}
.grp-title:hover .gchev{background:var(--accent);color:#fff}
.grp.closed>.grp-body{display:none}
.grp.closed>.grp-title .gchev::before{transform:rotate(-45deg)}
.grp.closed>.grp-title{margin-bottom:2px}
/* 二级分类内容缩进，层级更清晰 */
.grp>.grp-body{padding-top:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--panel);color:var(--text2);
  border-radius:20px;padding:4px 11px;font-size:12px;cursor:pointer;transition:.15s;font-family:inherit}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=search],select{border:1px solid var(--line);background:var(--panel);color:var(--text);
  border-radius:8px;padding:5px 10px;font-size:12.5px;outline:none;font-family:inherit}
input[type=search]:focus,select:focus{border-color:var(--accent)}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:12.5px}
.warn{margin:8px 0 0;padding:8px 11px;border-radius:8px;background:rgba(214,53,59,.08);
  border:1px solid rgba(214,53,59,.25);color:var(--up);font-size:12px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* 网格 */
.grid{display:grid;gap:9px}
.g-fx{grid-template-columns:repeat(auto-fill,minmax(186px,1fr))}
.g-idx{grid-template-columns:repeat(auto-fill,minmax(206px,1fr))}
.g-coin{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.g-fut{grid-template-columns:repeat(auto-fill,minmax(196px,1fr))}

/* 卡片 */
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;
  cursor:pointer;transition:.15s;position:relative}
.card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow)}
.card.active{border-color:var(--accent);background:var(--accent2)}
.card .c-name{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .c-name .tag{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.card .c-name .cty{color:var(--text);font-weight:700;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.card .c-price{font-size:19px;font-weight:700;letter-spacing:-.4px;margin:5px 0 3px;
  font-variant-numeric:tabular-nums;line-height:1.16;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .c-sub{display:flex;justify-content:space-between;font-size:11.5px;font-variant-numeric:tabular-nums;
  color:var(--muted);gap:8px}
.card .c-sub span{white-space:nowrap}
.card.hl{background:linear-gradient(180deg,var(--accent2),var(--panel2));border-color:var(--accent)}

/* K线展开面板 */
.chart-panel{grid-column:1/-1;background:var(--panel2);border:1px solid var(--accent);
  border-radius:11px;padding:11px 12px 6px;margin-top:2px}
.cp-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.cp-title{font-size:13px;font-weight:650}
.cp-tabs{display:flex;gap:4px}
.cp-tabs button{border:1px solid var(--line);background:var(--panel);color:var(--text2);
  border-radius:7px;padding:3px 10px;font-size:11.5px;cursor:pointer;font-family:inherit}
.cp-tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cp-tabs button:disabled{opacity:.4;cursor:not-allowed}
.cp-meta{margin-left:auto;display:flex;gap:12px;font-size:11.5px;color:var(--text2);flex-wrap:wrap}
#cpMeta{display:contents}   /* 让统计项直接成为 .cp-meta 的 flex 子项，共享 gap */
.cp-meta b{font-variant-numeric:tabular-nums}
.cp-close{border:1px solid var(--line);background:var(--panel);color:var(--text2);border-radius:7px;
  padding:3px 10px;font-size:11.5px;cursor:pointer;font-family:inherit}
.cp-close:hover{border-color:var(--up);color:var(--up)}
.cp-chart{width:100%;height:288px}
.cp-note{font-size:11px;color:var(--muted);margin:-2px 0 6px}

/* 表格 */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:620px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;background:var(--panel)}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line2);white-space:nowrap}
th{position:sticky;top:0;background:var(--head);font-weight:650;font-size:11.5px;color:var(--text2);z-index:2}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.pager{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;font-size:12px;color:var(--text2)}
.pager .pg-btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 10px;
  cursor:pointer;font-size:12px;font-family:inherit;color:var(--text2)}
.pager .pg-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pager .pg-btn:disabled{opacity:.4;cursor:not-allowed}
.pager .sp{margin-left:auto;display:flex;align-items:center;gap:8px}

/* 指数对比条 */
.bars{display:flex;flex-direction:column;gap:5px;margin-top:4px}
.bar-row{display:grid;grid-template-columns:130px 1fr 80px;gap:9px;align-items:center;font-size:12px}
.bar-track{height:9px;border-radius:5px;background:var(--line2);overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:5px;background:var(--accent)}
.bar-val{text-align:right;font-variant-numeric:tabular-nums;color:var(--text2)}

/* 统计小卡 */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.stat .s-k{font-size:11.5px;color:var(--muted)}
.stat .s-v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px}
.stat .s-d{font-size:11.5px;color:var(--muted);margin-top:2px}

.chart-box{width:100%;height:280px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---------------- 美国国债：对比指标 + 图表工具条 ---------------- */
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:10px;margin-bottom:12px}
.cmp .c{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.cmp .c-k{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.cmp .c-v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:5px;letter-spacing:.2px}
.cmp .c-d{font-size:11px;color:var(--muted);margin-top:3px}
.plot-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.plot-tools .tlab{font-size:11.5px;color:var(--muted);margin-right:2px}
.plot-tools button{border:1px solid var(--line);background:var(--panel);color:var(--text2);
  border-radius:7px;padding:4px 10px;font-size:11.5px;cursor:pointer;font-family:inherit;transition:.15s}
.plot-tools button:hover{border-color:var(--accent);color:var(--accent)}
.plot-tools button.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------------- 页脚：数据源清单 + 作者信息 ---------------- */
.foot{margin-top:24px;border-top:1px solid var(--line);padding-top:16px}
.foot .fh{font-size:12.5px;font-weight:650;color:var(--text2);margin:0 0 10px;
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;cursor:pointer;user-select:none}
.foot .fh .cnt{font-weight:400;color:var(--muted);font-size:11.5px}
.foot .fh .tg{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:400}
.src-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:0 16px}
.foot.closed .src-grid{display:none}
.src-it{font-size:11.5px;color:var(--text2);display:flex;gap:8px;align-items:baseline;
  border-bottom:1px dashed var(--line2);padding:5px 0}
.src-it .k{color:var(--muted);flex:0 0 106px;white-space:nowrap}
.src-it .v{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src-it .v a{color:var(--accent);font-size:11px}
.credit{margin-top:18px;padding:16px 10px 8px;border-top:1px dashed var(--line);text-align:center}
.credit .by{font-size:14px;font-weight:700;color:var(--text);letter-spacing:.3px}
.credit .by b{color:var(--accent)}
.credit .sub{margin-top:6px;font-size:11.5px;color:var(--muted);line-height:1.9}
.foot-note{margin:12px auto 0;max-width:940px;font-size:11px;color:var(--muted);
  line-height:1.85;text-align:center}

@media (max-width:900px){.two{grid-template-columns:1fr}}
@media (max-width:760px){
  .secnav{grid-template-columns:repeat(2,1fr)}
  .g-fx,.g-idx,.g-coin,.g-fut{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .sec-head .sum{display:none}
  .src-grid{grid-template-columns:1fr}
  .src-it .k{flex:0 0 84px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="inner">
    <div class="brand"><span class="dot"></span>全球金融数据看板</div>
    <div class="tools">
      <span class="status" id="status">正在加载…</span>
      <button class="btn" id="allOpen">全部展开</button>
      <button class="btn" id="allClose">全部收起</button>
      <button class="btn" id="autoBtn">自动刷新 关</button>
      <button class="btn" id="reload">刷新</button>
      <button class="btn" id="themeBtn">深色</button>
    </div>
  </div>
</header>

<div class="wrap">
  <!-- 板块类型选择：按钮，每行 4 个 -->
  <nav class="secnav" id="secnav"></nav>
  <main id="main"></main>

  <!-- 页脚：数据源清单 + 作者信息 -->
  <footer class="foot" id="foot">
    <div class="fh" id="footHead">
      <span>数据源清单</span>
      <span class="cnt" id="footCnt"></span>
      <span class="tg" id="footTg">点击收起 / 展开 ▾</span>
    </div>
    <div class="src-grid" id="srcGrid"></div>

    <div class="credit">
      <div class="by">设计：<b>公歧子</b>　微信：<b>gongqizi0</b></div>
      <div class="sub">全球金融数据看板 · 数据采集与可视化</div>
    </div>
    <div class="foot-note" id="footNote"></div>
  </footer>
</div>

<script>
"use strict";
/* ================================================================
   全局
================================================================ */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const S = {};                       // 各板块数据
let autoTimer = null;
let openPanel = null;               // 当前展开的图表 {key, el, chart}

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmt(p, d){
  if(p == null || isNaN(p)) return "—";
  if(d == null) d = digitsOf(p);
  return Number(p).toLocaleString("zh-CN", {minimumFractionDigits:d, maximumFractionDigits:d});
}
function digitsOf(p){
  if(p == null || isNaN(p)) return 2;
  const a = Math.abs(p);
  if(a >= 1000) return 2;
  if(a >= 100) return 2;
  if(a >= 10)  return 3;
  if(a >= 1)   return 4;
  if(a >= .01) return 5;
  if(a >= .0001) return 7;
  return 9;
}
function cls(v){ return v > 0 ? "up" : (v < 0 ? "down" : "flat"); }
function pctStr(v){ return (v == null || isNaN(v)) ? "—" : (v > 0 ? "+" : "") + v.toFixed(2) + "%"; }
function bpStr(v){ return (v == null || isNaN(v)) ? "—" : (v > 0 ? "+" : "") + v.toFixed(1) + "bp"; }
function bigN(v){
  if(v == null || isNaN(v)) return "—";
  const a = Math.abs(v);
  if(a >= 1e12) return (v / 1e12).toFixed(3) + " 万亿";
  if(a >= 1e8)  return (v / 1e8).toFixed(2) + " 亿";
  if(a >= 1e4)  return (v / 1e4).toFixed(2) + " 万";
  return fmt(v, 2);
}
async function api(path){
  const r = await fetch(path, {cache:"no-store"});
  if(!r.ok) throw new Error("HTTP " + r.status);
  return await r.json();
}

/* ================================================================
   数据源 / 信号源登记表
   —— 全部为公开、真实、可访问的上游接口，已逐一实测（HTTP 200 + 返回真实行情）
================================================================ */
const SRC = {
  fxLive:   {n:"新浪财经·外汇行情",       u:"https://finance.sina.com.cn/money/forex/hq/USDCNY.shtml"},
  fxHis:    {n:"新浪财经·外汇历史行情",   u:"https://vip.stock.finance.sina.com.cn/forex/api/jsonp.php"},
  cnIdx:    {n:"新浪财经·A股指数行情",    u:"https://finance.sina.com.cn/realstock/company/sh000001/nc.shtml"},
  hkIdx:    {n:"新浪财经·港股指数行情",   u:"https://stock.finance.sina.com.cn/hkstock/quotes/HSI.html"},
  txHis:    {n:"腾讯证券·K线与分时",      u:"https://gu.qq.com/"},
  jjhIdx:   {n:"金投网·全球股指行情",     u:"https://quote.cngold.org/gp/hqgz.html"},
  jjhHis:   {n:"金投网·全球股指历史K线",  u:"https://api.jijinhao.com/history/quotejs.htm"},
  sinaUS:   {n:"新浪财经·美股指数",       u:"https://stock.finance.sina.com.cn/usstock/quotes/.DJI.html"},
  sinaFut:  {n:"新浪财经·国际期货（外盘）",u:"https://finance.sina.com.cn/futures/quotes/GC.shtml"},

function getOrder(){

  const closed = getClosed();

/* ---------------- 拖动排序 ---------------- */
function bindDrag(){
  const main = $("#main");
  let dragEl = null;
  $$(".sec", main).forEach(sec => {
    const head = $(".sec-head", sec);
    head.addEventListener("dragstart", e => {
      if(e.target.closest(".sum") || e.target.tagName === "BUTTON"){ e.preventDefault(); return; }
      dragEl = sec; sec.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      try{ e.dataTransfer.setData("text/plain", sec.dataset.id); }catch(err){}
    });
    head.addEventListener("dragend", () => {
      sec.classList.remove("dragging");
      $$(".sec", main).forEach(x => x.classList.remove("drop-target"));
      if(dragEl){ persistOrder(); dragEl = null; }
    });
    sec.addEventListener("dragover", e => {
      if(!dragEl || dragEl === sec) return;
      e.preventDefault();
      const r = sec.getBoundingClientRect();
      const after = (e.clientY - r.top) > r.height / 2;
      sec.parentElement.insertBefore(dragEl, after ? sec.nextSibling : sec);
      sec.classList.add("drop-target");
    });
    sec.addEventListener("dragleave", () => sec.classList.remove("drop-target"));
    sec.addEventListener("drop", e => e.preventDefault());
  });
}
function persistOrder(){
  const ids = $$(".sec").map(el => el.dataset.id);
  localStorage.setItem(LS_ORDER, JSON.stringify(ids));
  $$(".sec").forEach((el, i) => { const c = $(".cidx", el); if(c) c.textContent = i + 1; });
  const defs = {}; SECTIONS.forEach(s => defs[s.id] = s);
  $("#secnav").innerHTML = ids.map(id => `<button data-go="${id}">${esc(defs[id].title)}</button>`).join("");
  $$("#secnav button").forEach(b => b.addEventListener("click", () => {
    const el = $("#sec-" + b.dataset.go);
    el.classList.remove("closed"); saveClosedFromDom();
    el.scrollIntoView({behavior:"smooth", block:"start"});
    window.scrollBy(0, -70); flash(b);
  }));
}

function axColor(){ return getComputedStyle(document.body).getPropertyValue("--muted").trim() || "#8a94a6"; }

function closePanel(){

    if(openPanel.chart){ try{ openPanel.chart.dispose(); }catch(e){} }

    if(card) card.classList.remove("active");

/**

function chartSrc(kind, code){
  if(kind === "fx")     return [SRC.fxHis];

  if(kind === "crypto") return [SRC.gate];
  if(kind === "index")  return (code || "").startsWith("JO_") ? [SRC.jjhHis] : [SRC.txHis];
  if(kind === "us")     return (code || "").startsWith("JO_") ? [SRC.jjhHis] : [SRC.sinaFutH];

  return [];
}

/**
 * 在卡片下方插入可折叠的图表面板
 * kind: fx | bond | index | us | crypto | futures
 */
function toggleChart(cardEl, kind, code, name, opts){
  const key = kind + ":" + code;
  if(openPanel && openPanel.key === key){ closePanel(); return; }
  closePanel();

  const allowInv = !!(opts && opts.invert);            // 汇率支持正反向
  const panel = document.createElement("div");
  panel.className = "chart-panel";
  panel.innerHTML =
    '<div class="cp-head">' +
      '<span class="cp-title">' + esc(name) + '</span>' +
      '<span class="cp-tabs">' +
        '<button data-t="min">分时</button>' +
        '<button data-t="day" class="on">日K</button>' +
        '<button data-t="month">月K</button>' +
        (allowInv ? '<button data-inv="1">正/反向</button>' : '') +
      '</span>' +
      (chartSrc(kind, code).length
        ? '<span class="cp-src">K线来源：' + slinks(chartSrc(kind, code)) + '</span>' : '') +
      '<span class="cp-meta"><span id="cpMeta"></span></span>' +
      '<button class="cp-close">收起 ▲</button>' +
    '</div>' +
    '<div class="cp-chart"></div>';

  cardEl.after(panel);
  cardEl.classList.add("active");
  const chart = echarts.init($(".cp-chart", panel));
  openPanel = {key, el:panel, chart, cardId:cardEl.id, kind, code, name, inv:false, cur:"day"};

  $(".cp-close", panel).addEventListener("click", closePanel);
  $$(".cp-tabs button[data-t]", panel).forEach(b => b.addEventListener("click", () => {
    if(b.disabled) return;
    $$(".cp-tabs button[data-t]", panel).forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    openPanel.cur = b.dataset.t;
    drawChart();
  }));
  const invBtn = $(".cp-tabs button[data-inv]", panel);
  if(invBtn) invBtn.addEventListener("click", () => {
    openPanel.inv = !openPanel.inv;
    invBtn.classList.toggle("on", openPanel.inv);
    $(".cp-title", panel).textContent = openPanel.name + (openPanel.inv ? "（反向）" : "");
    drawChart();
  });

  setTimeout(() => chart.resize(), 30);
  drawChart();
}

async function drawChart(){
  const P = openPanel;
  if(!P) return;
  const meta = $("#cpMeta", P.el);
  meta.textContent = "加载中…";
  try{
    const r = await api("/api/kline?kind=" + encodeURIComponent(P.kind) +
                        "&code=" + encodeURIComponent(P.code) +
                        "&type=" + encodeURIComponent(P.cur));
    let data = r.data || [];
    if(!r.ok || !data.length){
      meta.textContent = "";
      P.chart.clear();
      P.chart.setOption({title:{text:r.error || "暂无数据", left:"center", top:"middle",
        textStyle:{color:axColor(), fontSize:13, fontWeight:"normal"}}});
      return;
    }
    const digits = P.digits || digitsOf(P.cur === "min" ? data[data.length-1].v :
                                        (data[data.length-1].c || data[data.length-1].v));
    if(P.cur === "min"){
      let vals = data.map(x => x.v);
      const ref = (r.ref != null) ? r.ref : P.ref;     // 后端返回的昨收优先
      if(P.inv) vals = vals.map(v => v ? 1/v : null);
      drawLine(P.chart, data.map(x => x.t), vals, digits, ref, P.inv);
      meta.innerHTML = "<span>共 <b>" + data.length + "</b> 个点</span>";
    }else{
      let rows = data;
      if(P.inv) rows = rows.map(x => ({d:x.d, o:1/x.o, c:1/x.c, h:1/x.l, l:1/x.h}));
      drawCandle(P.chart, rows, digits);
      const last = rows[rows.length-1], first = rows[0];
      const chg = last.c - first.o;
      meta.innerHTML = "<span>共 <b>" + rows.length + "</b> 根</span>" +
        "<span>" + esc(last.d) + "</span>" +
        "<span class='" + cls(chg) + "'>收 <b>" + fmt(last.c, digits) + "</b></span>" +
        "<span>区间 " + fmt(Math.min.apply(null, rows.map(x => x.l)), digits) +
        " ~ " + fmt(Math.max.apply(null, rows.map(x => x.h)), digits) + "</span>";
    }
  }catch(e){
    meta.textContent = "";
    P.chart.clear();
    P.chart.setOption({title:{text:"加载失败：" + e.message, left:"center", top:"middle",
      textStyle:{color:upColor(), fontSize:12, fontWeight:"normal"}}});
  }
}

function drawLine(c, labels, values, digits, ref, inv){
  const ax = axColor(), ln = lineColor();
  const valid = values.filter(v => v != null);
  if(!valid.length){ c.clear(); return; }
  const lo = Math.min.apply(null, valid), hi = Math.max.apply(null, valid);
  const pad = (hi - lo) * 0.12 || (hi * 0.001) || 1;
  const v0 = valid[0];
  const color = valid[valid.length-1] >= v0 ? upColor() : downColor();
  const series = [{
    type:"line", data:values, showSymbol:false, smooth:false, connectNulls:true,
    lineStyle:{width:1.5, color:color},
    areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[
      {offset:0, color:color + "40"}, {offset:1, color:color + "00"}])},
    markLine: ref ? {silent:true, symbol:"none", data:[{yAxis:ref}],
      lineStyle:{type:"dashed", color:ax, width:1},
      label:{formatter:fmt(ref, digits), position:"insideEndTop", color:ax, fontSize:10}} : undefined
  }];
  c.setOption({
    animation:false, grid:{left:8, right:14, top:22, bottom:8, containLabel:true},
    tooltip:{trigger:"axis", backgroundColor:"rgba(25,32,45,.92)", borderWidth:0,
      textStyle:{color:"#fff", fontSize:11.5},
      formatter: p => p[0].axisValue + "<br/>" + fmt(p[0].data, digits)},
    xAxis:{type:"category", data:labels, boundaryGap:false,
      axisLine:{lineStyle:{color:ln}}, axisTick:{show:false},
      axisLabel:{color:ax, fontSize:10, interval:Math.max(0, Math.floor(labels.length/8)), hideOverlap:true}},
    yAxis:{type:"value", scale:true, min:lo - pad, max:hi + pad,
      splitLine:{lineStyle:{color:ln, type:"dashed"}},
      axisLabel:{color:ax, fontSize:10, formatter:v => fmt(v, digits)},
      axisLine:{show:false}, axisTick:{show:false}},
    series: series
  }, true);
}

function ma(rows, n){
  const out = [];
  for(let i = 0; i < rows.length; i++){
    if(i < n - 1){ out.push("-"); continue; }
    let s = 0;
    for(let j = 0; j < n; j++) s += rows[i-j].c;
    out.push(+(s/n).toFixed(4));
  }
  return out;
}

function drawCandle(c, rows, digits){
  const ax = axColor(), ln = lineColor();
  const dates = rows.map(r => r.d);
  const kd = rows.map(r => [r.o, r.c, r.l, r.h]);
  const up = upColor(), dn = downColor();
  c.setOption({
    animation:false,
    grid:{left:8, right:14, top:24, bottom:44, containLabel:true},
    tooltip:{trigger:"axis", axisPointer:{type:"cross"},
      backgroundColor:"rgba(25,32,45,.94)", borderWidth:0, textStyle:{color:"#fff", fontSize:11.5},
      formatter: ps => {
        const p = ps.find(x => x.seriesType === "candlestick") || ps[0];
        const i = p.dataIndex, r = rows[i];
        return "<b>" + r.d + "</b><br/>开 " + fmt(r.o, digits) + "　高 " + fmt(r.h, digits) +
               "<br/>低 " + fmt(r.l, digits) + "　收 " + fmt(r.c, digits);
      }},
    legend:{show:true, top:0, right:6, itemWidth:12, itemHeight:8,
      textStyle:{color:ax, fontSize:10}, data:["MA5","MA20"]},
    xAxis:{type:"category", data:dates, boundaryGap:true,
      axisLine:{lineStyle:{color:ln}}, axisTick:{show:false},
      axisLabel:{color:ax, fontSize:10, hideOverlap:true}},
    yAxis:{type:"value", scale:true, splitLine:{lineStyle:{color:ln, type:"dashed"}},
      axisLabel:{color:ax, fontSize:10, formatter:v => fmt(v, digits)},
      axisLine:{show:false}, axisTick:{show:false}},
    dataZoom:[
      {type:"inside", start:60, end:100},
      {type:"slider", height:16, bottom:6, start:60, end:100,
       borderColor:ln, fillerColor:"rgba(47,111,228,.13)",
       handleStyle:{color:"#2f6fe4"}, textStyle:{color:ax, fontSize:10}}
    ],
    series:[
      {name:"K线", type:"candlestick", data:kd,
       itemStyle:{color:up, color0:dn, borderColor:up, borderColor0:dn}},
      {name:"MA5", type:"line", data:ma(rows,5), showSymbol:false, smooth:true,
       lineStyle:{width:1, color:"#e8a33d"}, itemStyle:{color:"#e8a33d"}},
      {name:"MA20", type:"line", data:ma(rows,20), showSymbol:false, smooth:true,
       lineStyle:{width:1, color:"#7a5cd6"}, itemStyle:{color:"#7a5cd6"}}
    ]
  }, true);
}

const LS_GCLOSED = "gfd.gclosed.v1";
function getGClosed(){ try{ return JSON.parse(localStorage.getItem(LS_GCLOSED) || "[]"); }catch(e){ return []; } }
function setGClosed(l){ try{ localStorage.setItem(LS_GCLOSED, JSON.stringify(l)); }catch(e){} }
function grp(key, title, right, body){
  const closed = getGClosed().indexOf(key) >= 0;
  return '<div class="grp' + (closed ? " closed" : "") + '" data-g="' + esc(key) + '">' +
    '<div class="grp-title" title="点击折叠 / 展开本分类"><span class="gchev"></span>' +
    '<span class="gt">' + title + '</span>' + (right || "") + '</div>' +
    '<div class="grp-body">' + body + '</div></div>';
}
function bindGrp(root){
  $$(".grp > .grp-title", root || document).forEach(h => {
    if(h.dataset.bound) return;
    h.dataset.bound = "1";
    h.addEventListener("click", e => {
      if(e.target.closest("a, button, input, select")) return;   // 标题行里的链接 / 控件不受影响
      const g = h.parentElement;
      g.classList.toggle("closed");
      const list = getGClosed(), k = g.dataset.g, i = list.indexOf(k);
      if(g.classList.contains("closed")){ if(i < 0) list.push(k); }
      else if(i >= 0){ list.splice(i, 1); }
      setGClosed(list);
      if(!g.classList.contains("closed")) resizeChartsIn(g);
    });
  });
}

function bondName(x, byCountry){
  if(!byCountry) return esc(x.label || "");

function bondTable(key, title, rows, srcs, byCountry){
  const okN = rows.filter(x => x.ok).length;
  const cntTxt = byCountry
    ? okN + ' / ' + rows.length + ' 个国家 · 单位：%'
    : okN + ' / ' + rows.length + ' 有数据';
  const colW = byCountry ? 150 : 158;
  return grp(key, esc(title),
    '<span class="cnt">' + cntTxt + '</span>' + gsrc(srcs),
    '<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(' + colW + 'px,1fr))">' +
    rows.map(x => x.ok
      ? '<div class="card" data-bcode="' + esc(x.code) + '" data-bname="' + esc((x.country || "") + " " + (x.label || "")) + '"' +
          ' title="' + esc((x.country || "") + (x.label ? " " + x.label : "") + "：" + fmt(x.yield, 3) + "%") + '">' +
          '<div class="c-name">' + bondName(x, byCountry) + '</div>' +
          '<div class="c-price ' + cls(x.bp) + '">' + fmt(x.yield, 3) + '%</div>' +
          '<div class="c-sub"><span class="' + cls(x.bp) + '">' + bpStr(x.bp) + '</span>' +
          '<span>' + esc(x.date || "") + '</span></div></div>'
      : '<div class="card" style="opacity:.55;cursor:default">' +
          '<div class="c-name">' + bondName(x, byCountry) + '</div>' +
          '<div class="c-price" style="font-size:14px;color:var(--muted)">暂无数据</div>' +
          '<div class="c-sub"><span>—</span><span></span></div></div>'
    ).join("") + '</div>');
}

function drawCurve(elId, rows){
  const el = $("#" + elId); if(!el) return;
  const chart = echarts.init(el);
  if(!rows.length){
    chart.setOption({title:{text:"暂无数据", left:"center", top:"middle",
      textStyle:{color:axColor(), fontSize:12, fontWeight:"normal"}}});
    bindResize(chart, "#" + elId); return;
  }
  const ax = axColor(), ln = lineColor();
  chart.setOption({
    animation:false, grid:{left:6, right:14, top:18, bottom:6, containLabel:true},
    tooltip:{trigger:"axis", backgroundColor:"rgba(25,32,45,.94)", borderWidth:0,
      textStyle:{color:"#fff", fontSize:11.5},
      formatter: p => p[0].axisValue + " 年期<br/>" + fmt(p[0].data, 3) + "%"},
    xAxis:{type:"category", data:rows.map(x => x.label), axisLine:{lineStyle:{color:ln}},
      axisTick:{show:false}, axisLabel:{color:ax, fontSize:10, hideOverlap:true, interval:"auto"}},
    yAxis:{type:"value", scale:true, splitLine:{lineStyle:{color:ln, type:"dashed"}},
      axisLine:{show:false}, axisTick:{show:false},
      axisLabel:{color:ax, fontSize:10, formatter:v => v.toFixed(2) + "%"}},
    series:[{type:"line", data:rows.map(x => x.yield), smooth:true, symbolSize:5,
      itemStyle:{color:"#2f6fe4"}, lineStyle:{width:2, color:"#2f6fe4"},
      areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[
        {offset:0, color:"rgba(47,111,228,.28)"}, {offset:1, color:"rgba(47,111,228,0)"}])}}]
  });
  bindResize(chart, "#" + elId);
}

/* ================================================================
   8) 美国国债数据（表格 + 分页 + Excel）
================================================================ */
const debtState = {page:1, size:20, span:260,
  types:{total:true, public:true, intragov:true}};
/* 可展示的数据类型（图例 / 按钮均可切换） */
const DEBT_TYPE = [["total","国债总额","#2f6fe4"],
                   ["public","公众持有","#e8a33d"],
                   ["intragov","政府内部持有","#17a673"]];
/* 图表可选时间范围 */
const DEBT_SPAN = [["近 3 个月",65],["近 1 年",260],["近 3 年",780],
                   ["近 5 年",1300],["近 10 年",2600]];

/* 金额变化：美元 -> 亿美元（带符号） */
function debtDelta(v){
  if(v == null || isNaN(v)) return "—";
  const y = v / 1e8;
  return (y > 0 ? "+" : "") + y.toLocaleString("zh-CN", {minimumFractionDigits:1, maximumFractionDigits:1}) + " 亿";
}
function cmpCard(k, v, p, date){
  return '<div class="c"><div class="c-k">' + k + '</div>' +
    '<div class="c-v ' + (v == null ? "" : cls(v)) + '">' + debtDelta(v) + '</div>' +
    '<div class="c-d">' + (p == null ? "暂无对比数据" : pctStr(p)) +
    (date ? ' · 参照日 ' + esc(date) : '') + '</div></div>';
}

async function loadDebt(){
  const d = await api("/api/debt?page=" + debtState.page + "&size=" + debtState.size);
  S.debt = d;
  const cp = d.compare || {};
  setSummary("debt", d.latest ? '<span>最新 <b>' + esc(d.latest.date) + '</b></span>' +
    '<span>总额 <b>' + bigN(d.latest.total) + '</b></span>' +
    (cp.dod == null ? "" : '<span class="' + cls(cp.dod) + '">较上日 ' + debtDelta(cp.dod) + '</span>') +
    '<span>共 <b>' + d.total + '</b> 条</span>' : "");
  if(!d.ok){
    setBody("debt", '<div class="warn">' + esc(d.error || "数据获取失败") + '</div>');
    return;
  }
  /* ① 数据比较：相较上一交易日 / 上月同期 / 上年同期 —— 排在明细数据表之前 */
  let html = '<div class="cmp">' +
    '<div class="c"><div class="c-k">国债总额（最新）</div>' +
      '<div class="c-v">' + bigN(d.latest.total) + ' 美元</div>' +
      '<div class="c-d">' + esc(d.latest.date) + ' · 公众持有 ' + bigN(d.latest.public) +
      ' · 政府内部 ' + bigN(d.latest.intragov) + '</div></div>' +
    cmpCard("较上一交易日", cp.dod, cp.dodP, cp.dodDate) +
    cmpCard("较上月同期", cp.mom, cp.momP, cp.momDate) +
    cmpCard("较上年同期", cp.yoy, cp.yoyP, cp.yoyDate) +
    '</div>';

  /* ② 走势图：总额 / 公众持有 / 政府内部持有（数据类型与时间范围均可切换）—— 同样在明细表之前 */
  html += grp("debt-chart", "国债余额走势与持有结构",
    '<span class="cnt">单位：万亿美元 · 可切换数据类型 / 时间范围</span>' + gsrc([SRC.debt]),
    '<div class="plot-tools" id="debtTypes"><span class="tlab">数据类型</span>' +
      DEBT_TYPE.map(t => '<button data-t="' + t[0] + '"' +
        (debtState.types[t[0]] ? ' class="on"' : '') + '>' + t[1] + '</button>').join("") +
    '</div>' +
    '<div class="plot-tools" id="debtSpans"><span class="tlab">时间范围</span>' +
      DEBT_SPAN.map(s => '<button data-n="' + s[1] + '"' +
        (s[1] === debtState.span ? ' class="on"' : '') + '>' + s[0] + '</button>').join("") +
    '</div>' +
    '<div class="chart-box" id="debtChart" style="height:300px"></div>');

  /* ③ 逐日明细表：全量 · 分页 · Excel 下载（放在最后） */
  const rows = d.rows || [];
  let tbody = "";
  rows.forEach((r, i) => {
    tbody += '<tr><td>' + ((d.page - 1) * d.size + i + 1) + '</td>' +
      '<td>' + esc(r.date) + '</td>' +
      '<td class="r">' + fmt(r.total, 2) + '</td>' +
      '<td class="r">' + fmt(r.public, 2) + '</td>' +
      '<td class="r">' + fmt(r.intragov, 2) + '</td>' +
      '<td class="r"><b>' + (r.total != null ? (r.total / 1e12).toFixed(4) : "—") + '</b></td>' +
      '<td class="r ' + (r.dodP == null ? "" : cls(r.dodP)) + '">' + debtDelta(r.dod) + '</td>' +
      '<td class="r ' + (r.momP == null ? "" : cls(r.momP)) + '">' + debtDelta(r.mom) + '</td>' +
      '<td class="r ' + (r.yoyP == null ? "" : cls(r.yoyP)) + '">' + debtDelta(r.yoy) + '</td></tr>';
  });
  html += grp("debt-table", "逐日明细数据（Debt to the Penny，1993 年至今）",
    '<span class="cnt">共 ' + d.total + ' 条 · 每页 ' + d.size + ' 条</span>' + gsrc([SRC.debt]) +
    '<span class="sp"></span><button class="btn" id="debtXlsx">⤓ 下载全部 Excel</button>',
    '<div class="tbl-wrap"><table><thead><tr>' +
      '<th style="width:52px">#</th><th>日期</th><th class="r">国债总额（美元）</th>' +
      '<th class="r">公众持有（美元）</th><th class="r">政府内部持有（美元）</th>' +
      '<th class="r">总额（万亿）</th><th class="r">较上日</th>' +
      '<th class="r">较上月同期</th><th class="r">较上年同期</th>' +
    '</tr></thead><tbody>' + tbody + '</tbody></table></div>' +
    '<div class="pager">' +
      '<button class="pg-btn" id="dpFirst" ' + (d.page <= 1 ? "disabled" : "") + '>« 首页</button>' +
      '<button class="pg-btn" id="dpPrev" ' + (d.page <= 1 ? "disabled" : "") + '>‹ 上一页</button>' +
      '<span>第 <b>' + d.page + '</b> / ' + d.pages + ' 页</span>' +
      '<button class="pg-btn" id="dpNext" ' + (d.page >= d.pages ? "disabled" : "") + '>下一页 ›</button>' +
      '<button class="pg-btn" id="dpLast" ' + (d.page >= d.pages ? "disabled" : "") + '>末页 »</button>' +
      '<span class="sp">每页显示' +
        '<select id="dpSize">' + [10, 20, 100].map(n =>
          '<option value="' + n + '"' + (n === d.size ? " selected" : "") + '>' + n + ' 条</option>').join("") +
        '</select><span style="color:var(--muted)">数据区间 ' + esc(d.oldest || "") + ' ~ ' +
        esc(d.latest ? d.latest.date : "") + '</span>' +
      '</span></div>');
  setBody("debt", html);

  $("#debtXlsx").addEventListener("click", () => {
    const b = $("#debtXlsx"); b.textContent = "正在生成…"; b.disabled = true;
    window.location.href = "/api/debt/export";
    setTimeout(() => { b.textContent = "⤓ 下载全部 Excel"; b.disabled = false; }, 2600);
  });
  const go = (p) => { debtState.page = p; loadDebt(); };
  $("#dpFirst").addEventListener("click", () => go(1));
  $("#dpPrev").addEventListener("click", () => go(d.page - 1));
  $("#dpNext").addEventListener("click", () => go(d.page + 1));
  $("#dpLast").addEventListener("click", () => go(d.pages));
  $("#dpSize").addEventListener("change", e => { debtState.size = +e.target.value; debtState.page = 1; loadDebt(); });
  // 数据类型切换（总额 / 公众持有 / 政府内部持有）
  $$("#debtTypes button").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.t;
    const on = Object.keys(debtState.types).filter(x => debtState.types[x]);
    if(debtState.types[k] && on.length === 1) return;      // 至少保留一条曲线
    debtState.types[k] = !debtState.types[k];
    b.classList.toggle("on", debtState.types[k]);
    drawDebtChart();
  }));
  // 时间范围切换
  $$("#debtSpans button").forEach(b => b.addEventListener("click", () => {
    debtState.span = +b.dataset.n;
    $$("#debtSpans button").forEach(x => x.classList.toggle("on", x === b));
    drawDebtChart();
  }));
  drawDebtChart();
}

/* 国债走势图：总额 / 公众持有 / 政府内部持有 三条曲线，可切数据类型与时间范围 */
function drawDebtChart(){
  const el = $("#debtChart"); if(!el || !S.debt) return;
  let chart = echarts.getInstanceByDom(el);
  if(!chart){ chart = echarts.init(el); bindResize(chart, "#debtChart"); }
  const ax = axColor(), ln = lineColor();
  const all = S.debt.series || [];
  const rows = debtState.span > 0 ? all.slice(-debtState.span) : all;
  if(!rows.length){
    chart.clear();
    chart.setOption({title:{text:"暂无走势数据", left:"center", top:"middle",
      textStyle:{color:ax, fontSize:13, fontWeight:"normal"}}});
    return;
  }
  const T = 1e12;
  const chosen = DEBT_TYPE.filter(t => debtState.types[t[0]]);
  const series = chosen.map(t => ({
    name: t[1], type: "line", showSymbol: false, smooth: true, connectNulls: true,
    data: rows.map(r => (r[t[0]] == null ? null : +(r[t[0]] / T).toFixed(4))),
    itemStyle: {color: t[2]},
    lineStyle: {width: t[0] === "total" ? 2.4 : 1.7, color: t[2]},
    emphasis: {focus: "series"},
    areaStyle: t[0] === "total" ? {color: new echarts.graphic.LinearGradient(0,0,0,1,[
      {offset:0, color:"rgba(47,111,228,.20)"}, {offset:1, color:"rgba(47,111,228,0)"}])} : null
  }));
  chart.setOption({
    animation:false,
    grid:{left:8, right:18, top:34, bottom:8, containLabel:true},
    legend:{top:0, left:"center", type:"scroll", itemWidth:16, itemGap:14,
      textStyle:{color:ax, fontSize:11.5}},
    tooltip:{trigger:"axis", backgroundColor:"rgba(25,32,45,.94)", borderWidth:0,
      textStyle:{color:"#fff", fontSize:11.5},
      formatter: p => {
        let s = '<b>' + p[0].axisValue + '</b>';
        p.forEach(x => {
          s += '<br/>' + x.marker + x.seriesName + '：' +
            (x.data == null ? "—" : x.data.toFixed(4) + ' 万亿美元');
        });
        return s;
      }},
    xAxis:{type:"category", data:rows.map(r => r.date), boundaryGap:false,
      axisLine:{lineStyle:{color:ln}}, axisTick:{show:false},
      axisLabel:{color:ax, fontSize:10, hideOverlap:true}},
    yAxis:{type:"value", scale:true, splitLine:{lineStyle:{color:ln, type:"dashed"}},
      axisLine:{show:false}, axisTick:{show:false},
      axisLabel:{color:ax, fontSize:10, formatter:v => v.toFixed(1) + "T"}},
    dataZoom:[{type:"inside", start:0, end:100}],
    series
  }, true);
}

/* ================================================================
   9) 各国央行利率（金投网）
================================================================ */
async function loadRates(){
  const d = await api("/api/rates");
  S.rates = d;
  const items = (d.items || []).filter(x => x.ok);
  const top = items.slice(0, 4);
  setSummary("rate", top.map(x => '<span>' + esc(x.country) + ' <b>' + fmt(x.cur, 2) + '%</b></span>').join("") +
    '<span>共 ' + items.length + ' 个国家/地区</span>');
  if(!d.ok){
    setBody("rate", '<div class="warn">' + esc(d.error || "央行利率数据获取失败") + '</div>');
    return;
  }
  let html = grp("rate-tbl", "各国央行基准利率",
    '<span class="cnt">主要国家排前 · 含当前值 / 前次值 / 变动 / 公布日期</span>' + gsrc([SRC.rate]),
    '<div class="tbl-wrap" style="max-height:520px"><table><thead><tr>' +
      '<th style="width:52px">#</th><th>国家 / 地区</th><th>利率名称</th>' +
      '<th class="r">当前值</th><th class="r">前次值</th><th class="r">变动</th>' +
      '<th class="r">公布日期</th></tr></thead><tbody>' +
      (d.items || []).map((x, i) =>
        '<tr><td>' + (i + 1) + '</td>' +
        '<td><b>' + esc(x.country) + '</b></td>' +
        '<td style="color:var(--text2)">' + esc(x.name) + '</td>' +
        '<td class="r"><b>' + (x.cur == null ? "—" : fmt(x.cur, 2) + "%") + '</b></td>' +
        '<td class="r">' + (x.prev == null ? "—" : fmt(x.prev, 2) + "%") + '</td>' +
        '<td class="r ' + cls(x.bp) + '">' + esc(x.bpText) + '</td>' +
        '<td class="r" style="color:var(--muted)">' + esc(x.date || "—") + '</td></tr>').join("") +
      '</tbody></table></div>');
  html += grp("rate-cmp", "主要国家利率水平对比",
    '<span class="cnt">单位：% · 前 18 个主要国家 / 地区 · 可滚轮缩放</span>' + gsrc([SRC.rate]),
    '<div class="chart-box" id="rateBars" style="height:' +
      Math.max(300, Math.min(items.length, 18) * 24 + 60) + 'px"></div>');
  if(d.error) html += '<div class="warn">' + esc(d.error) + '</div>';
  setBody("rate", html);
  drawRateBars();
}

/* 主要国家利率水平对比（横向柱状图） */
function rateColor(v){
  if(v == null) return "#8a94a6";
  if(v >= 5) return "#d6353b";
  if(v >= 3) return "#e8a33d";
  if(v >= 1) return "#2f6fe4";
  if(v > 0)  return "#17a673";
  return "#8a94a6";
}
function drawRateBars(){
  const el = $("#rateBars"); if(!el) return;
  let chart = echarts.getInstanceByDom(el);
  if(!chart){ chart = echarts.init(el); bindResize(chart, "#rateBars"); }
  const ax = axColor(), ln = lineColor();
  const show = ((S.rates || {}).items || []).filter(x => x.ok).slice(0, 18);
  if(!show.length){
    chart.clear();
    chart.setOption({title:{text:"暂无利率数据", left:"center", top:"middle",
      textStyle:{color:ax, fontSize:13, fontWeight:"normal"}}});
    return;
  }
  chart.setOption({
    animation:true,
    grid:{left:8, right:70, top:14, bottom:8, containLabel:true},
    tooltip:{trigger:"item", backgroundColor:"rgba(25,32,45,.94)", borderWidth:0,
      textStyle:{color:"#fff", fontSize:11.5},
      formatter: p => {
        const x = show[p.dataIndex];
        return '<b>' + esc(x.country) + '</b><br/>' + esc(x.name || "基准利率") +
          '：' + fmt(x.cur, 2) + '%' +
          (x.prev == null ? '' : '<br/>前值：' + fmt(x.prev, 2) + '%') +
          '<br/>变动：' + esc(x.bpText || "—") + (x.date ? '<br/>公布：' + esc(x.date) : '');
      }},
    xAxis:{type:"value", splitLine:{lineStyle:{color:ln, type:"dashed"}},
      axisLine:{show:false}, axisTick:{show:false},
      axisLabel:{color:ax, fontSize:10, formatter:"{value}%"}},
    yAxis:{type:"category", inverse:true, data:show.map(x => x.country),
      axisLine:{lineStyle:{color:ln}}, axisTick:{show:false},
      axisLabel:{color:ax, fontSize:11}},
    series:[{
      type:"bar", barMaxWidth:16,
      data: show.map(x => ({value: x.cur, itemStyle:{color: rateColor(x.cur)}})),
      label:{show:true, position:"right", color:ax, fontSize:11,
        formatter: p => p.value.toFixed(2) + "%"}
    }],
    dataZoom:[{type:"inside", yAxisIndex:0, start:0, end:100}]
  }, true);
}

/* ================================================================
   窗口自适应
================================================================ */
function bindResize(chart, sel){
  const fn = () => { try{ chart.resize(); }catch(e){} };
  window.addEventListener("resize", fn);
  const sec = $(sel) && $(sel).closest(".sec");
  if(sec){
    const head = $(".sec-head", sec);
    if(head) head.addEventListener("click", () => setTimeout(fn, 220));
  }
}
window.addEventListener("resize", () => { if(openPanel && openPanel.chart) openPanel.chart.resize(); });

/* ================================================================
   主题
================================================================ */
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  $("#themeBtn").textContent = t === "dark" ? "浅色" : "深色";
  localStorage.setItem(LS_THEME, t);
  // 重绘图表
  if(openPanel) drawChart();
  if(S.rmb) { const c = echarts.getInstanceByDom($("#rmbChart")); }
  reThemeCharts();
}
function reThemeCharts(){
  setTimeout(() => {
    ["#bondChartUs", "#bondChartCn", "#debtChart", "#rmbChart"].forEach(sel => {
      const el = $(sel);
      if(!el) return;
      const c = echarts.getInstanceByDom(el);
      if(!c) return;
      const ax = axColor(), ln = lineColor();
      c.setOption({xAxis:{axisLabel:{color:ax}, axisLine:{lineStyle:{color:ln}}},
                   yAxis:{axisLabel:{color:ax}, splitLine:{lineStyle:{color:ln, type:"dashed"}}}});
    });
  }, 60);
}

/* ================================================================
   加载全部
================================================================ */
const LOADERS = {
  fx: loadFx, world: loadWorld, us: loadUs, crypto: loadCrypto, fut: loadFutures,
  rmb: loadRmb, bond: loadBonds, debt: loadDebt, rate: loadRates
};

async function loadAll(showStatus){
  if(showStatus) $("#status").textContent = "正在加载…";
  const t0 = Date.now();
  const ids = getOrder();
  const results = await Promise.allSettled(ids.map(id => LOADERS[id] ? LOADERS[id]() : null));
  let bad = 0;
  results.forEach((r, i) => {
    if(r.status === "rejected"){
      bad++;
      const id = ids[i];
      const b = $("#body-" + id);
      if(b) b.innerHTML = '<div class="warn">加载失败：' + esc(r.reason && r.reason.message || r.reason) + '</div>';
    }
  });
  $("#status").textContent = (bad ? "部分板块失败 " + bad + " 个 · " : "") +
    "更新于 " + new Date().toLocaleTimeString("zh-CN") + " · 耗时 " + ((Date.now() - t0) / 1000).toFixed(1) + "s";
}

/* ================================================================
   启动
================================================================ */
(function init(){
  const saved = localStorage.getItem(LS_THEME);
  applyTheme(saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

  buildShell();
  buildFooter();
  loadAll(true);

  $("#themeBtn").addEventListener("click", () =>
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"));
  $("#reload").addEventListener("click", () => { closePanel(); loadAll(true); });
  $("#allOpen").addEventListener("click", () => {
    $$(".sec").forEach(el => el.classList.remove("closed"));
    saveClosedFromDom();
    setTimeout(() => $$(".sec").forEach(el => { const c = el.dataset.id; if(["rmb","bond","debt","rate"].includes(c)) {} }), 0);
  });
  $("#allClose").addEventListener("click", () => {
    closePanel();
    $$(".sec").forEach(el => el.classList.add("closed"));
    saveClosedFromDom();
  });
  $("#autoBtn").addEventListener("click", () => {
    const b = $("#autoBtn");
    if(autoTimer){ clearInterval(autoTimer); autoTimer = null; b.textContent = "自动刷新 关"; b.classList.remove("on"); }
    else{
      autoTimer = setInterval(() => loadAll(false), 30000);
      b.textContent = "自动刷新 30s"; b.classList.add("on");
    }
  });
  window.addEventListener("beforeunload", closePanel);
})();
</script>
